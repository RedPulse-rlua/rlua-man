<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ff2d2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="rlua">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="rlua — защита Lua-кода для Roblox">
  <title>rlua</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <div class="bg-glow"></div>

  <div id="app"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bnav-btn active" data-page="lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Главная</span>
    </button>
    <button class="bnav-btn" data-page="lua">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Файлы</span>
    </button>
    <button class="bnav-btn" data-page="vizor">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>VIZOR</span>
    </button>
    <button class="bnav-btn" data-page="profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Профиль</span>
    </button>
    <button class="bnav-btn" data-page="admin" id="bnavAdmin" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Админ</span>
    </button>
  </nav>

  <div class="modal-overlay hidden" id="authModal">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>
      <form id="loginForm" class="auth-form">
        <h2 class="form-title">Вход</h2>
        <label>Ник</label>
        <input type="text" id="loginUsername" placeholder="nickname" autocomplete="username" required>
        <label>Секретное слово</label>
        <input type="password" id="loginWord" autocomplete="current-password" required>
        <label>Пароль</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <p class="form-error hidden" id="loginError"></p>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <h2 class="form-title">Регистрация</h2>
        <label>Ник</label>
        <input type="text" id="regUsername" placeholder="nickname" autocomplete="username" required>
        <label>Секретное слово</label>
        <input type="password" id="regWord" placeholder="Минимум 6 символов" autocomplete="new-password" minlength="6" required>
        <label>Пароль</label>
        <input type="password" id="regPassword" placeholder="Минимум 6 символов" autocomplete="new-password" minlength="6" required>
        <p class="form-error hidden" id="registerError"></p>
        <p class="form-ok hidden" id="registerOk"></p>
        <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
      </form>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/app/app.js"></script>
</body>
</html>
